 y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="318" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="400" fill="#17324d" text-anchor="middle">queues and reports</text><line x1="950" y1="400" x2="1230" y2="580" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="483" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="400" fill="#17324d" text-anchor="middle">messages</text><line x1="1230" y1="610" x2="950" y2="430" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1090" y="513" font-family="Arial,Helvetica,sans-serif" font-size="13px" font-weight="400" fill="#17324d" text-anchor="middle">delivery result</text><text x="800" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16px" font-weight="400" fill="#64748b" text-anchor="middle">The database is internal to SRS-SPPO and is not directly accessed by public actors.</text></svg>