<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="800" y="38" font-family="Arial,Helvetica,sans-serif" font-size="26px" font-weight="700" fill="#17324d" text-anchor="middle">Figure 4. Context-Level Data Flow Diagram</text><text x="800" y="66" font-family="Arial,Helvetica,sans-serif" font-size="15px" font-weight="400" fill="#64748b" text-anchor="middle">External actors exchange information with SRS-SPPO as one system process</text><rect x="80" y="300" width="260" height="120" rx="10" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="210" y="328" font-family="Arial,Helvetica,sans-serif" font-size="18px" font-weight="700" fill="#17324d" text-anchor="middle">PARISHIONER / PUBLIC</text><text x="210" y="355" font-family="Arial,Helvetica,sans-serif" font-size="14px" font-weight="400" fill="#0f172a" text-anchor="middle">forms, tracking details</text><text x="210" y="376" font-family="Arial,Helvetica,sans-serif" font-size="14px" font-weight="400" fill="#0f172a" text-anchor="middle">information requests</text><rect x="650" y="300" width="300" height="150" rx="18" fill="#dcfce7" stroke="#17324d" stroke-width="2"/><text x="800" y="328" font-family="Arial,Helvetica,sans-serif" font-size="18px" font-weight="700" fill="#17324d" text-anchor="middle">SRS-SPPO</text><text x="800" y="355" font-family="Arial,Helvetica,sans-serif" font-size="14px" font-weight="400" fill="#0f172a" text-anchor="middle">public intake</text><text x="800" y="376" font-family="Arial,Helvetica,sans-serif" font-size="14px" font-weight="400" fill="#0f172a" text-anchor="middle">staff workflow</text><text x="800" y="397" font-family="Arial,Helvetica,sans-serif" font-size="14px" font-weight="400" fill="#0f172a" text-anchor="middle">records and reporting</text><rect