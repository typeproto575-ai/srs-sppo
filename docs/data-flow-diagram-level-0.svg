<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">SRS-SPPO Data Flow Diagram - Level 0 Context Diagram</title>
  <desc id="description">Context diagram showing data exchanged between the SRS-SPPO v2, parishioners, parish secretary, email service, and Google Drive backup service.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .entity { fill: #fff; stroke: #111; stroke-width: 2.5; }
      .process { fill: #fff; stroke: #111; stroke-width: 3; }
      .flow { fill: none; stroke: #222; stroke-width: 2; marker-end: url(#arrow); }
      .title { font-size: 30px; font-weight: 700; text-anchor: middle; }
      .subtitle { font-size: 17px; text-anchor: middle; fill: #444; }
      .entity-label { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .entity-note { font-size: 14px; text-anchor: middle; fill: #444; }
      .process-label { font-size: 24px; font-weight: 700; text-anchor: middle; }
      .process-note { font-size: 16px; text-anchor: middle; }
      .flow-label { font-size: 14px; fill: #222; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="#fff"/>
  <text x="800" y="48" class="title">Data Flow Diagram — Level 0 (Context Diagram)</text>
  <text x="800" y="76" class="subtitle">Schedule and Record System of Saint Patrick Parish Office (SRS-SPPO v2)</text>

  <rect x="75" y="325" width="240" height="150" class="entity"/>
  <text x="195" y="384" class="entity-label">PARISHIONER</text>
  <text x="195" y="414" class="entity-note">Public visitor</text>
  <text x="195" y="438" class="entity-note">No account or login</text>

  <rect x="1285" y="325" width="240" height="150" class="entity"/>
  <text x="1405" y="384" class="entity-label">PARISH SECRETARY</text>
  <text x="1405" y="414" class="entity-note">Only staff role</text>
  <text x="1405" y="438" class="entity-note">Authenticated access</text>

  <rect x="650" y="290" width="300" height="220" rx="38" class="process"/>
  <text x="800" y="365" class="process-label">0</text>
  <text x="800" y="402" class="process-label">SRS-SPPO</text>
  <text x="800" y="440" class="process-note">Public portal and</text>
  <text x="800" y="465" class="process-note">parish office workflows</text>

  <rect x="655" y="120" width="290" height="95" class="entity"/>
  <text x="800" y="160" class="entity-label">EMAIL SERVICE</text>
  <text x="800" y="187" class="entity-note">External SMTP provider</text>

  <rect x="655" y="685" width="290" height="95" class="entity"/>
  <text x="800" y="725" class="entity-label">GOOGLE DRIVE</text>
  <text x="800" y="752" class="entity-note">Optional scheduled backups</text>

  <path d="M315 355 C430 275 520 275 650 345" class="flow"/>
  <text x="390" y="276" class="flow-label">Public information requests; certificate/application form data</text>

  <path d="M650 435 C525 520 430 520 315 445" class="flow"/>
  <text x="385" y="545" class="flow-label">Public content; submission confirmation and reference number</text>

  <path d="M1285 355 C1160 275 1060 275 950 345" class="flow"/>
  <text x="1058" y="276" class="flow-label">Login credentials; online/onsite intake; staff updates</text>

  <path d="M950 435 C1060 520 1160 520 1285 445" class="flow"/>
  <text x="1045" y="545" class="flow-label">Work queues; person/record search; reports and print-ready output</text>

  <path d="M740 290 C700 255 700 240 735 215" class="flow"/>
  <text x="520" y="245" class="flow-label">Status email content</text>
  <path d="M865 215 C900 238 900 252 865 290" class="flow"/>
  <text x="894" y="249" class="flow-label">Delivery result</text>

  <path d="M735 510 C700 565 700 620 735 685" class="flow"/>
  <text x="512" y="596" class="flow-label">Encrypted database backup</text>
  <path d="M865 685 C900 625 900 568 865 510" class="flow"/>
  <text x="900" y="604" class="flow-label">Upload result</text>

  <text x="800" y="880" class="subtitle">Parishioner submissions are intake only; staff review and in-person office processing remain required.</text>
</svg>
